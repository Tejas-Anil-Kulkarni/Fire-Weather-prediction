<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Weather Index Data Input</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            margin-top: 0;
            color: #333333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555555;
        }
        input[type="number"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        .results, .error {
            margin-top: 25px;
            padding: 15px;
            border-radius: 4px;
        }
        .results {
            background-color: #e9f7ef;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Fire Weather System Inputs</h2>
    <form action="{{ url_for('predict_data') }}" method="POST">

        <div class="form-group">
            <label for="temp">Temperature (°C):</label>
            <input type="number" step="0.1" id="temp" name="temp" required
                   value="{{ request.form.temp if request.form.temp else '' }}"
                   placeholder="e.g., 29">
        </div>

        <div class="form-group">
            <label for="rh">Relative Humidity (RH %):</label>
            <input type="number" step="0.1" id="rh" name="rh" required
                   value="{{ request.form.rh if request.form.rh else '' }}"
                   placeholder="e.g., 57">
        </div>

        <div class="form-group">
            <label for="ws">Wind Speed (WS km/h):</label>
            <input type="number" step="0.1" id="ws" name="ws" required
                   value="{{ request.form.ws if request.form.ws else '' }}"
                   placeholder="e.g., 18">
        </div>

        <div class="form-group">
            <label for="rain">Rainfall (mm):</label>
            <input type="number" step="0.1" id="rain" name="rain" required
                   value="{{ request.form.rain if request.form.rain else '' }}"
                   placeholder="e.g., 0.0">
        </div>

        <div class="form-group">
            <label for="ffmc">Fine Fuel Moisture Code (FFMC):</label>
            <input type="number" step="0.1" id="ffmc" name="ffmc" required
                   value="{{ request.form.ffmc if request.form.ffmc else '' }}"
                   placeholder="e.g., 65.7">
        </div>

        <div class="form-group">
            <label for="dmc">Duff Moisture Code (DMC):</label>
            <input type="number" step="0.1" id="dmc" name="dmc" required
                   value="{{ request.form.dmc if request.form.dmc else '' }}"
                   placeholder="e.g., 3.4">
        </div>

        <div class="form-group">
            <label for="isi">Initial Spread Index (ISI):</label>
            <input type="number" step="0.1" id="isi" name="isi" required
                   value="{{ request.form.isi if request.form.isi else '' }}"
                   placeholder="e.g., 1.3">
        </div>

        <div class="form-group">
            <label for="classes">Classes:</label>
            <select id="classes" name="classes" required>
                <option value="" disabled {% if not request.form.classes %}selected{% endif %}>Select class</option>
                <option value="fire" {% if request.form.classes == 'fire' %}selected{% endif %}>Fire</option>
                <option value="not_fire" {% if request.form.classes == 'not_fire' %}selected{% endif %}>Not Fire</option>
            </select>
        </div>

        <div class="form-group">
            <label for="region">Region:</label>
            <select id="region" name="region" required>
                <option value="" disabled {% if not request.form.region %}selected{% endif %}>Select region</option>
                <option value="Bejaia" {% if request.form.region == 'Bejaia' %}selected{% endif %}>Bejaia Region</option>
                <option value="Sidi-Bel Abbes" {% if request.form.region == 'Sidi-Bel Abbes' %}selected{% endif %}>Sidi-Bel Abbes Region</option>
            </select>
        </div>

        <button type="submit">Submit Parameters</button>
    </form>
    
    <h1>FWI (Fire Weather Index) = {{result}}</h1>

</div>

</body>
</html>
